<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kookia</title>
  <meta name="description" content="Le stock de nourriture de la maison, partagé à deux : frigo, congélateur, placard, fruits et légumes, recettes anti-gaspillage et liste de courses.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kookia">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1512" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="screen" tabindex="-1">
    <div class="boot"><span class="spinner"></span></div>
  </main>

  <nav class="tabbar" aria-label="Navigation principale">
    <button class="tab" data-tab="frigo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5h8M7.5 6.5h9a1.5 1.5 0 0 1 1.5 1.5v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8a1.5 1.5 0 0 1 1.5-1.5z"/><path d="M8.5 3.5v3M15.5 3.5v3M6 11h12"/></svg>
      <span>Stock</span><b class="tab-badge" data-badge="frigo" hidden></b>
    </button>
    <button class="tab" data-tab="recettes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2.5v6.5a2 2 0 0 0 4 0V2.5M9 11v10.5M17 21.5V2.5c-2 1-3.2 3.4-3.2 7v3.8H17"/></svg>
      <span>Recettes</span>
    </button>
    <button class="tab" data-tab="courses">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/><path d="M3 3.5h2.2l2.3 11.5h10.8l2-8H6.3"/></svg>
      <span>Courses</span><b class="tab-badge" data-badge="courses" hidden></b>
    </button>
    <button class="tab" data-tab="reglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      <span>Réglages</span>
    </button>
  </nav>

  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
